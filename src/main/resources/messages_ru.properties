error.ticket_not_found = Билет поддержки не найден
error.invalid_ticket_status = Неверный статус билета
error.category_not_found = Категория не найдена
error.comment_not_found = Комментарий не найден
error.attachment_failed = Ошибка при добавлении вложения
error.faq_not_found = Вопрос FAQ не найден
